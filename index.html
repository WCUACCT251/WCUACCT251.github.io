<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCT 251 Course Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#592C88;
    --panel-deep:#3B1D5C;
    --purple:#592C88;
    --purple-mid:#7A4CA8;
    --gold:#C9A24B;
    --gold-soft:#E6CE93;
    --bg:#F7F5F0;
    --paper:#FFFFFF;
    --ink:#211D2E;
    --slate:#5C5768;
    --line:#E4E0D6;
    --shadow: 0 1px 2px rgba(33,29,46,0.05), 0 12px 28px rgba(33,29,46,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 32px; }

  .topbar{
    height:5px;
    background:linear-gradient(90deg, var(--purple) 0%, var(--gold) 100%);
  }
  .goldbar{
    height:5px;
    background:var(--gold);
  }

  /* ---------- Header: full-bleed photo, purple spotlight behind text ---------- */
  header{
    position:relative;
    min-height:480px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 680px 460px at 50% 50%, var(--panel) 0%, rgba(89,44,136,0.97) 34%, rgba(89,44,136,0.7) 54%, rgba(89,44,136,0.25) 74%, rgba(89,44,136,0) 88%),
      linear-gradient(rgba(40,20,64,0.12), rgba(40,20,64,0.12)),
      url('images/header-mountain.jpg');
    background-size:cover, cover, cover;
    background-position:center, center, center 55%;
    background-repeat:no-repeat;
  }
  .header-inner{
    position:relative; z-index:2;
    max-width:620px;
    margin:0 auto;
    padding:64px 32px;
    text-align:left;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; letter-spacing:.05em; color:var(--gold-soft);
    margin:0 0 18px;
    text-transform:uppercase;
    text-shadow:0 1px 14px rgba(0,0,0,0.45);
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(32px,3.6vw,46px);
    line-height:1.12;
    margin:0 0 18px;
    color:#FFFFFF;
    text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .dek{
    font-size:16.5px;
    color:#EDE6F3;
    margin:0;
    text-shadow:0 1px 16px rgba(0,0,0,0.35);
  }

  /* ---------- Controls ---------- */
  .controls{ padding:40px 0 0; }
  .search-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .search-row input[type="text"]{
    flex:1 1 240px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-row input[type="text"]:focus{ outline:2px solid var(--purple-mid); outline-offset:1px; }
  .type-tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .type-tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--slate);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .type-tab.active{
    background:var(--panel);
    border-color:var(--panel);
    color:#FBF8F1;
  }

  /* ---------- Materials ---------- */
  main{ padding:30px 0 64px; }

  .empty-state{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:46px 32px;
    text-align:center;
  }
  .empty-state p{ margin:0 auto; max-width:46ch; color:var(--slate); font-size:15px; }
  .empty-state .empty-title{
    font-family:'Source Serif 4',serif;
    font-size:19px; font-weight:600; color:var(--panel); margin:0 0 8px;
  }

  .assign-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:24px;
  }
  .assign-card{
    display:flex;
    flex-direction:row;
    align-items:stretch;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .assign-card:hover{ transform:translateY(-2px); border-color:var(--purple-mid); }
  .assign-cover{
    flex:0 0 120px;
    width:120px;
    background:linear-gradient(160deg, var(--purple) 0%, var(--panel-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    text-align:center;
    padding:12px;
  }
  .assign-body{ padding:16px 20px; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .assign-meta{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    margin:0 0 6px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .assign-title{ font-weight:600; font-size:15.5px; color:var(--ink); margin:0 0 6px; }
  .assign-desc{ font-size:13.5px; color:var(--slate); margin:0; }

  @media (max-width:560px){
    .assign-cover{ flex-basis:76px; width:76px; font-size:12px; padding:10px 6px; }
    .assign-body{ padding:14px 16px; }
  }

  /* ---------- Footer ---------- */
  footer{
    padding:26px 0 48px;
    color:var(--slate);
    font-size:13px;
    text-align:center;
    border-top:1px solid var(--line);
  }

  @media (max-width:800px){
    header{
      min-height:360px;
      background:
        radial-gradient(ellipse 320px 420px at 50% 50%, var(--panel) 0%, rgba(89,44,136,0.92) 30%, rgba(89,44,136,0.5) 55%, rgba(89,44,136,0) 80%),
        linear-gradient(rgba(40,20,64,0.12), rgba(40,20,64,0.12)),
        url('images/header-mountain.jpg');
      background-size:cover, cover, cover;
      background-position:center, center, center 55%;
      background-repeat:no-repeat;
    }
    .header-inner{ padding:44px 24px; max-width:none; }
  }
</style>
</head>
<body>

<div class="topbar"></div>

<header>
  <div class="header-inner">
    <p class="eyebrow">Western Carolina University &middot; Accounting</p>
    <h1>ACCT 251 Course Materials</h1>
    <p class="dek">Reading notes, guided walkthroughs, and homework packets for Principles of Financial Accounting.</p>
  </div>
</header>

<div class="goldbar"></div>

<div class="wrap controls">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search by title or chapter&hellip;">
  </div>
  <div class="type-tabs" id="typeTabs">
    <button class="type-tab active" data-type="all">All</button>
    <button class="type-tab" data-type="notes">Notes</button>
    <button class="type-tab" data-type="walkthrough">Walkthroughs</button>
    <button class="type-tab" data-type="homework">Homework</button>
  </div>
</div>

<main class="wrap">
  <!--
    Add items to the MATERIALS array below. Each entry:

    { type: "notes" | "walkthrough" | "homework",
      chapter: "Ch. 1", title: "Intro to Financial Statements",
      description: "Reading guide covering the four core statements.",
      link: "https://your-repo.github.io/" }

    The empty state disappears automatically once MATERIALS has entries.
  -->
  <div id="materialsRoot"></div>
</main>

<footer>
  <div class="wrap">
    <p>Western Carolina University &middot; Department of Accounting</p>
  </div>
</footer>

<script>
  // Add course materials here as they're built — order in this array doesn't
  // affect the page. Items are always displayed: Notes first, then
  // Walkthroughs, then Homework; within that, by chapter number; within
  // that, by the "order" number below (not shown anywhere on the page —
  // it's just so you can control the sequence of same-chapter, same-type
  // items, e.g. which walkthrough example comes first). Leave "order" out
  // of an entry and it'll just sort after any numbered ones, by title.
  //
  // The N / W / H section dividers below are just for you — paste new
  // entries under the matching letter so items of the same type stay
  // together while you're editing.
  //
  //   { type: "notes" | "walkthrough" | "homework",
  //     chapter: "Ch. 1", title: "Intro to Financial Statements",
  //     description: "Reading guide covering the four core statements.",
  //     link: "notes/ch1-part-a.html", order: 1 },
  //
  // Links are relative to this file — e.g. a notes page saved at
  // /notes/ch3-part-a.html is linked here as "notes/ch3-part-a.html".
  const MATERIALS = [

    // ---- N — NOTES ----
    { type: "notes", chapter: "Ch. 2", title: "Part A: Measuring Business Activities",
      description: "Transaction analysis and the accounting equation, built around Nantahala Paddling Academy's first month in business.",
      link: "notes/ch2-part-a.html", order: 1 },
    { type: "notes", chapter: "Ch. 2", title: "Part B: Debits and Credits",
      description: "Debit/credit rules, journal entries, posting to T-accounts, and the trial balance.",
      link: "notes/ch2-part-b.html", order: 2 },

    // ---- W — WALKTHROUGHS ----
    { type: "walkthrough", chapter: "Ch. 2", title: "Transaction Analysis & Journal Entries Walkthrough Example 1",
      description: "Eight guided transactions for Bryson City Bike Works — analyze the equation effect, then write the journal entry, with reveal-to-check solutions.",
      link: "walkthroughs/ch2-transactions-walkthrough.html", order: 1 },
    { type: "walkthrough", chapter: "Ch. 2", title: "Transactions Analysis & Journal Entries Walkthrough Example 2",
      description: "Eight more guided transactions for Bryson City Bike Works' second month — collecting receivables, paying payables, buying on account, deferred revenue, and dividends.",
      link: "walkthroughs/ch2-december-transactions-walkthrough.html", order: 2 },

    // ---- H — HOMEWORK ----
    { type: "homework", chapter: "Ch. 2", title: "Accounting Cycle: Journal, Ledger & Unadjusted Trial Balance",
      description: "Self-grading, ID-seeded practice for Bryson City Bike Works — journalize 15 transactions, post to true fillable T-accounts, and prepare a trial balance.",
      link: "homework/ch2-accounting-cycle-review.html", order: 1 },

  ];

  // Sort order: type (Notes, then Walkthroughs, then Homework) → chapter
  // number → the hidden "order" field above → title as a final tiebreaker.
  const TYPE_RANK = { notes: 0, walkthrough: 1, homework: 2 };
  function chapterNum(chapterStr) {
    const match = /(\d+)/.exec(chapterStr || '');
    return match ? parseInt(match[1], 10) : Infinity;
  }
  MATERIALS.sort((a, b) => {
    const aType = TYPE_RANK[a.type] !== undefined ? TYPE_RANK[a.type] : 99;
    const bType = TYPE_RANK[b.type] !== undefined ? TYPE_RANK[b.type] : 99;
    if (aType !== bType) return aType - bType;
    const chapterDiff = chapterNum(a.chapter) - chapterNum(b.chapter);
    if (chapterDiff !== 0) return chapterDiff;
    const aOrder = a.order !== undefined ? a.order : Infinity;
    const bOrder = b.order !== undefined ? b.order : Infinity;
    if (aOrder !== bOrder) return aOrder - bOrder;
    return (a.title || '').localeCompare(b.title || '');
  });

  const TYPE_LABELS = { notes: 'Notes', walkthrough: 'Walkthrough', homework: 'Homework' };

  let activeType = 'all';

  function render() {
    const root = document.getElementById('materialsRoot');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = MATERIALS.filter(m => {
      const matchesType = activeType === 'all' || m.type === activeType;
      const haystack = `${m.title} ${m.chapter || ''} ${m.description || ''}`.toLowerCase();
      const matchesQuery = !query || haystack.includes(query);
      return matchesType && matchesQuery;
    });

    if (MATERIALS.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p class="empty-title">Nothing posted yet</p>
          <p>Notes, walkthroughs, and homework will appear here as they're built &mdash; check back soon.</p>
        </div>`;
      return;
    }

    if (filtered.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p class="empty-title">No matches</p>
          <p>Try a different search term or filter.</p>
        </div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'assign-grid';
    filtered.forEach(m => {
      const card = document.createElement('a');
      card.className = 'assign-card';
      card.href = m.link;
      const label = TYPE_LABELS[m.type] || '';
      card.innerHTML = `
        <div class="assign-cover">${m.chapter || ''}</div>
        <div class="assign-body">
          <p class="assign-meta">${[label, m.chapter].filter(Boolean).join(' &middot; ')}</p>
          <p class="assign-title">${m.title}</p>
          <p class="assign-desc">${m.description || ''}</p>
        </div>`;
      grid.appendChild(card);
    });
    root.innerHTML = '';
    root.appendChild(grid);
  }

  document.getElementById('typeTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.type-tab');
    if (!btn) return;
    document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.type;
    render();
  });
  document.getElementById('searchInput').addEventListener('input', render);

  render();
</script>

</body>
</html>
