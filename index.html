<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCT 251 Course Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#592C88;
    --panel-deep:#3B1D5C;
    --purple:#592C88;
    --purple-mid:#7A4CA8;
    --gold:#C9A24B;
    --gold-soft:#E6CE93;
    --gold-text:#8A6A2E;   /* gold darkened for text on white: 5.0:1 (AA needs 4.5:1) */
    --bg:#F7F5F0;
    --paper:#FFFFFF;
    --ink:#211D2E;
    --slate:#5C5768;
    --line:#E4E0D6;        /* decorative dividers only */
    --line-ui:#8F8059;     /* borders of inputs, buttons, cards: 3.6:1+ on white and page bg (WCAG 1.4.11) */
    --shadow: 0 1px 2px rgba(33,29,46,0.05), 0 12px 28px rgba(33,29,46,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 32px; }

  /* Visually hidden, still read by screen readers */
  .sr-only{
    position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); clip-path:inset(50%); white-space:nowrap; border:0;
  }

  /* Skip link: first thing keyboard users reach (WCAG 2.4.1) */
  .skip-link{
    position:absolute; left:12px; top:-80px; z-index:100;
    background:#FFFFFF; color:var(--panel); font-weight:600; font-size:15px;
    padding:12px 18px; border:2px solid var(--panel); border-radius:8px; text-decoration:none;
  }
  .skip-link:focus{ top:12px; }

  /* One clear, high-contrast focus indicator everywhere (WCAG 2.4.7, 1.4.11) */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:3px solid var(--panel); outline-offset:3px;
  }
  main:focus{ outline:none; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
    .assign-card:hover{ transform:none !important; }
  }

  .topbar{
    height:5px;
    background:linear-gradient(90deg, var(--purple) 0%, var(--gold) 100%);
  }
  .goldbar{
    height:5px;
    background:var(--gold);
  }

  /* ---------- Header: full-bleed photo, purple spotlight behind text ---------- */
  header{
    position:relative;
    overflow:hidden;
    min-height:480px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 680px 460px at 50% 50%, var(--panel) 0%, rgba(89,44,136,0.97) 34%, rgba(89,44,136,0.7) 54%, rgba(89,44,136,0.25) 74%, rgba(89,44,136,0) 88%),
      linear-gradient(rgba(40,20,64,0.12), rgba(40,20,64,0.12)),
      url('images/header-mountain.jpg');
    background-size:cover, cover, cover;
    background-position:center, center, center 55%;
    background-repeat:no-repeat;
  }
  .header-inner{
    position:relative; z-index:2;
    max-width:620px;
    margin:0 auto;
    padding:64px 32px;
    text-align:left;
    /* Solid-enough purple behind the text at every screen size and zoom level,
       so contrast never depends on which part of the photo is underneath
       (worst case is 5.4:1 for the smallest text). */
    background:rgba(89,44,136,0.92);
    border-radius:32px;
    box-shadow:0 0 70px 34px rgba(89,44,136,0.92);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; letter-spacing:.05em; color:var(--gold-soft);
    margin:0 0 18px;
    text-transform:uppercase;
    text-shadow:0 1px 14px rgba(0,0,0,0.45);
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(32px,3.6vw,46px);
    line-height:1.12;
    margin:0 0 18px;
    color:#FFFFFF;
    text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .dek{
    font-size:16.5px;
    color:#EDE6F3;
    margin:0;
    text-shadow:0 1px 16px rgba(0,0,0,0.35);
  }

  /* ---------- Controls ---------- */
  .controls{ padding:40px 0 0; }
  .search-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .search-row input[type="text"]{
    flex:1 1 240px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:11px 14px;
    border:1px solid var(--line-ui);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-row input[type="text"]::placeholder{ color:var(--slate); opacity:1; }
  .type-tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .type-tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line-ui);
    background:var(--paper);
    color:var(--slate);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .type-tab.active{
    background:var(--panel);
    border-color:var(--panel);
    color:#FBF8F1;
  }
  /* A check mark so the selected filter isn't shown by color alone (WCAG 1.4.1) */
  .type-tab.active::before{ content:"\2713\00a0"; content:"\2713\00a0" / ""; }

  /* ---------- Materials ---------- */
  main{ padding:0 0 64px; }
  .results{ padding-top:30px; }

  .empty-state{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:46px 32px;
    text-align:center;
  }
  .empty-state p{ margin:0 auto; max-width:46ch; color:var(--slate); font-size:15px; }
  .empty-state .empty-title{
    font-family:'Source Serif 4',serif;
    font-size:19px; font-weight:600; color:var(--panel); margin:0 0 8px;
  }

  .assign-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:24px 0 0;
    padding:0;
    list-style:none;
  }
  .assign-card{
    display:flex;
    flex-direction:row;
    align-items:stretch;
    background:var(--paper);
    border:1px solid var(--line-ui);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .assign-card:hover{ transform:translateY(-2px); border-color:var(--purple-mid); }
  .assign-cover{
    flex:0 0 120px;
    width:120px;
    background:linear-gradient(160deg, var(--purple) 0%, var(--panel-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    text-align:center;
    padding:12px;
  }
  .assign-body{ padding:16px 20px; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .assign-meta{
    display:flex; align-items:center; flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold-text);
    margin:0 0 6px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .assign-meta [aria-hidden="true"]{ margin:0 8px; }
  .assign-title{ font-weight:600; font-size:16px; line-height:1.35; color:var(--ink); margin:0 0 6px; overflow-wrap:anywhere; }
  .assign-desc{ font-size:14px; color:var(--slate); margin:0; overflow-wrap:anywhere; }

  @media (max-width:560px){
    .assign-cover{ flex-basis:76px; width:76px; font-size:12px; padding:10px 6px; }
    .assign-body{ padding:14px 16px; }
  }

  /* ---------- Footer ---------- */
  footer{
    padding:26px 0 48px;
    color:var(--slate);
    font-size:13px;
    text-align:center;
    border-top:1px solid var(--line);
  }

  @media (max-width:800px){
    header{
      min-height:360px;
      background:
        radial-gradient(ellipse 320px 420px at 50% 50%, var(--panel) 0%, rgba(89,44,136,0.92) 30%, rgba(89,44,136,0.5) 55%, rgba(89,44,136,0) 80%),
        linear-gradient(rgba(40,20,64,0.12), rgba(40,20,64,0.12)),
        url('images/header-mountain.jpg');
      background-size:cover, cover, cover;
      background-position:center, center, center 55%;
      background-repeat:no-repeat;
    }
    .header-inner{ padding:44px 24px; max-width:none; width:100%; border-radius:0; box-shadow:0 0 40px 20px rgba(89,44,136,0.92); }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="topbar" aria-hidden="true"></div>

<header>
  <div class="header-inner">
    <p class="eyebrow">Western Carolina University &middot; Accounting</p>
    <h1>ACCT 251 Course Materials</h1>
    <p class="dek">Reading notes, guided walkthroughs, and homework packets for Principles of Financial Accounting.</p>
  </div>
</header>

<div class="goldbar" aria-hidden="true"></div>

<main id="main-content" tabindex="-1">

<div class="wrap controls" role="search" aria-labelledby="controlsHeading">
  <h2 id="controlsHeading" class="sr-only">Search and filter course materials</h2>
  <div class="search-row">
    <label for="searchInput" class="sr-only">Search by title or chapter</label>
    <input type="text" id="searchInput" placeholder="Search by title or chapter&hellip;" autocomplete="off">
  </div>
  <div class="type-tabs" id="typeTabs" role="group" aria-label="Filter by material type">
    <button type="button" class="type-tab active" data-type="all" aria-pressed="true">All</button>
    <button type="button" class="type-tab" data-type="notes" aria-pressed="false">Notes</button>
    <button type="button" class="type-tab" data-type="walkthrough" aria-pressed="false">Walkthroughs</button>
    <button type="button" class="type-tab" data-type="homework" aria-pressed="false">Homework</button>
  </div>
</div>

<section class="wrap results" aria-labelledby="resultsHeading">
  <h2 id="resultsHeading" class="sr-only">Course materials</h2>
  <!--
    Add items to the MATERIALS array below. Each entry:

    { type: "notes" | "walkthrough" | "homework",
      chapter: "Ch. 1", title: "Intro to Financial Statements",
      description: "Reading guide covering the four core statements.",
      link: "https://your-repo.github.io/" }

    The empty state disappears automatically once MATERIALS has entries.
  -->
  <div id="materialsRoot"></div>
</section>

</main>

<!-- Announces result counts to screen readers when searching or filtering (WCAG 4.1.3) -->
<div id="resultStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<footer>
  <div class="wrap">
    <p>Western Carolina University &middot; Department of Accounting</p>
  </div>
</footer>

<script>
  // Add course materials here as they're built — order in this array doesn't
  // affect the page. Items are always displayed: Notes first, then
  // Walkthroughs, then Homework; within that, by chapter number; within
  // that, by the "order" number below (not shown anywhere on the page —
  // it's just so you can control the sequence of same-chapter, same-type
  // items, e.g. which walkthrough example comes first). Leave "order" out
  // of an entry and it'll just sort after any numbered ones, by title.
  //
  // The N / W / H section dividers below are just for you — paste new
  // entries under the matching letter so items of the same type stay
  // together while you're editing.
  //
  //   { type: "notes" | "walkthrough" | "homework",
  //     chapter: "Ch. 1", title: "Intro to Financial Statements",
  //     description: "Reading guide covering the four core statements.",
  //     link: "notes/ch1-part-a.html", order: 1 },
  //
  // Links are relative to this file — e.g. a notes page saved at
  // /notes/ch3-part-a.html is linked here as "notes/ch3-part-a.html".
  const MATERIALS = [

    // ---- N — NOTES ----
    { type: "notes", chapter: "Ch. 2", title: "Part A: Measuring Business Activities",
      description: "Transaction analysis and the accounting equation, built around Nantahala Paddling Academy's first month in business.",
      link: "notes/ch2-part-a.html", order: 1 },
    { type: "notes", chapter: "Ch. 2", title: "Part A: Measuring Business Activities Practice Quiz",
      description: "Multiple Choice practice quiz based on the Part A reading notes.",
      link: "quizzes/Ch2-PartA_Quiz.html", order: 2 },
    { type: "notes", chapter: "Ch. 2", title: "Part B: Debits and Credits",
      description: "Debit/credit rules, journal entries, posting to T-accounts, and the trial balance.",
      link: "notes/ch2-part-b.html", order: 3 },

    // ---- W — WALKTHROUGHS ----
    { type: "walkthrough", chapter: "Ch. 2", title: "Transaction Analysis & Journal Entries Walkthrough Example 1",
      description: "Eight guided transactions for Bryson City Bike Works — analyze the equation effect, then write the journal entry, with reveal-to-check solutions.",
      link: "walkthroughs/ch2-transactions-walkthrough.html", order: 1 },
    { type: "walkthrough", chapter: "Ch. 2", title: "Transactions Analysis & Journal Entries Walkthrough Example 2",
      description: "Eight more guided transactions for Bryson City Bike Works' second month — collecting receivables, paying payables, buying on account, deferred revenue, and dividends.",
      link: "walkthroughs/ch2-december-transactions-walkthrough.html", order: 2 },

    // ---- H — HOMEWORK ----
    { type: "homework", chapter: "Ch. 2", title: "Accounting Cycle: Journal, Ledger & Unadjusted Trial Balance",
      description: "Self-grading, ID-seeded practice for Bryson City Bike Works — journalize 15 transactions, post to true fillable T-accounts, and prepare a trial balance.",
      link: "homework/ch2-accounting-cycle-review.html", order: 1 },

  ];

  // Sort order: type (Notes, then Walkthroughs, then Homework) → chapter
  // number → the hidden "order" field above → title as a final tiebreaker.
  const TYPE_RANK = { notes: 0, walkthrough: 1, homework: 2 };
  function chapterNum(chapterStr) {
    const match = /(\d+)/.exec(chapterStr || '');
    return match ? parseInt(match[1], 10) : Infinity;
  }
  MATERIALS.sort((a, b) => {
    const aType = TYPE_RANK[a.type] !== undefined ? TYPE_RANK[a.type] : 99;
    const bType = TYPE_RANK[b.type] !== undefined ? TYPE_RANK[b.type] : 99;
    if (aType !== bType) return aType - bType;
    const chapterDiff = chapterNum(a.chapter) - chapterNum(b.chapter);
    if (chapterDiff !== 0) return chapterDiff;
    const aOrder = a.order !== undefined ? a.order : Infinity;
    const bOrder = b.order !== undefined ? b.order : Infinity;
    if (aOrder !== bOrder) return aOrder - bOrder;
    return (a.title || '').localeCompare(b.title || '');
  });

  const TYPE_LABELS = { notes: 'Notes', walkthrough: 'Walkthrough', homework: 'Homework' };
  const TYPE_FILTER_NAMES = { all: 'all types', notes: 'notes', walkthrough: 'walkthroughs', homework: 'homework' };

  let activeType = 'all';
  let userHasInteracted = false;   // don't announce anything on first page load
  let announceTimer = null;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function announce(message) {
    const status = document.getElementById('resultStatus');
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => { status.textContent = ''; status.textContent = message; }, 400);
  }

  function emptyState(title, message) {
    const box = el('div', 'empty-state');
    box.appendChild(el('h3', 'empty-title', title));
    box.appendChild(el('p', '', message));
    return box;
  }

  function render() {
    const root = document.getElementById('materialsRoot');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = MATERIALS.filter(m => {
      const matchesType = activeType === 'all' || m.type === activeType;
      const haystack = `${m.title} ${m.chapter || ''} ${m.description || ''}`.toLowerCase();
      const matchesQuery = !query || haystack.includes(query);
      return matchesType && matchesQuery;
    });

    root.textContent = '';

    if (MATERIALS.length === 0) {
      root.appendChild(emptyState('Nothing posted yet', "Notes, walkthroughs, and homework will appear here as they're built \u2014 check back soon."));
      return;
    }

    if (filtered.length === 0) {
      root.appendChild(emptyState('No matches', 'Try a different search term or filter.'));
      if (userHasInteracted) announce('No materials match your search or filter.');
      return;
    }

    const list = el('ul', 'assign-grid');
    list.setAttribute('role', 'list');
    filtered.forEach((m, i) => {
      const item = el('li');
      const card = el('a', 'assign-card');
      card.href = m.link;

      // The chapter block is decorative repeat of the chapter in the label below
      const cover = el('div', 'assign-cover', m.chapter || '');
      cover.setAttribute('aria-hidden', 'true');

      const body = el('div', 'assign-body');
      const meta = el('p', 'assign-meta');
      meta.id = `mat-${i}-meta`;
      meta.appendChild(el('span', '', TYPE_LABELS[m.type] || ''));
      if (m.chapter) {
        const sep = el('span', '', '\u00B7');
        sep.setAttribute('aria-hidden', 'true');
        meta.appendChild(sep);
        meta.appendChild(el('span', '', m.chapter));
      }
      const title = el('h3', 'assign-title', m.title);
      title.id = `mat-${i}-title`;
      const desc = el('p', 'assign-desc', m.description || '');
      desc.id = `mat-${i}-desc`;

      // Link name = the title; type/chapter and description are read as its description
      card.setAttribute('aria-labelledby', title.id);
      card.setAttribute('aria-describedby', `${meta.id} ${desc.id}`);

      body.append(meta, title, desc);
      card.append(cover, body);
      item.appendChild(card);
      list.appendChild(item);
    });
    root.appendChild(list);

    if (userHasInteracted) {
      announce(`Showing ${filtered.length} of ${MATERIALS.length} materials, filtered to ${TYPE_FILTER_NAMES[activeType]}.`);
    }
  }

  document.getElementById('typeTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.type-tab');
    if (!btn) return;
    userHasInteracted = true;
    document.querySelectorAll('.type-tab').forEach(t => {
      const isActive = t === btn;
      t.classList.toggle('active', isActive);
      t.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    activeType = btn.dataset.type;
    render();
  });
  document.getElementById('searchInput').addEventListener('input', () => {
    userHasInteracted = true;
    render();
  });

  render();
</script>

</body>
</html>
